name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack project zip
        run: |
          if [ ! -f settings.gradle.kts ]; then
            ZIP=$(ls *.zip | head -n1)
            mkdir -p _src
            unzip -q "$ZIP" -d _src
          fi
          F=$(find . -name settings.gradle.kts | head -n1)
          echo "PROJECT_DIR=$(dirname "$F")" >> "$GITHUB_ENV"

      - name: Apply build fixes
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/; s/isShrinkResources = true/isShrinkResources = false/' app/build.gradle.kts
          cat >> app/build.gradle.kts <<'GRADLE'
          android { lint { checkReleaseBuilds = false; abortOnError = false } }
          GRADLE
          cat >> app/proguard-rules.pro <<'RULES'
          -dontwarn org.slf4j.**
          -dontwarn javax.**
          -dontwarn java.awt.**
          -ignorewarnings
          RULES

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          grep -E "^e: |ERROR|What went wrong|Execution failed|error:" -A2 build.log | head -60

      - uses: actions/upload-artifact@v4
        with:
          name: PortYouStudio-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
